<ion-content
  [fullscreen]="true"
  class="mail-page"
>
  <app-mail-shell>

    <app-mail-sidebar
      mail-sidebar
      (compose)="openCompose()"
      (folderChange)="onFolderChange()"
    ></app-mail-sidebar>

    <app-mail-topbar
      mail-topbar
      [userName]="currentUser()?.name ?? ''"
      [mailboxAddress]="currentUser()?.mailbox_address ?? ''"
      [avatarUrl]="currentUser()?.avatar_url ?? null"
      (searchClick)="openSearch()"
    ></app-mail-topbar>

    @if (isComposeOpen()) {

      <app-mail-compose
        mail-content
        [isSending]="isSending()"
        [sendStatus]="sendStatus()"
        [editDraft]="editDraft()"
        [replyDraft]="replyDraft()"
        (discard)="closeCompose()"
        (draftSaved)="onDraftSaved()"
        (sendRequested)="sendMail($event)"
      ></app-mail-compose>

    } @else {

      <app-mail-inbox
        mail-content
        [searchQuery]="searchQuery()"
        (draftEditRequested)="openDraft($event)"
        (replyRequested)="openReply($event)"
      ></app-mail-inbox>

    }

  </app-mail-shell>
</ion-content>
